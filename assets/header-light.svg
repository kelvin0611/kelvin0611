<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">Full-stack and AI</title>
<desc id="desc">Building AI tools for education with Next.js, Django and LLMs.</desc>
<defs>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0B1220" flood-opacity="0.08"/></filter>
  <clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
</defs>
<style>
  .eyebrow { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang HK', monospace; letter-spacing: .16em; fill: #0F8B7E; }
  .name { font: 800 76px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang HK', 'Noto Sans TC', sans-serif; letter-spacing: -.035em; fill: #14161A; }
  .tag { font: 400 28px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang HK', 'Noto Sans TC', sans-serif; letter-spacing: -.01em; fill: #4A5160; }
  .tag b { font-weight: 600; }
  .chip { font: 500 16px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang HK', 'Noto Sans TC', sans-serif; fill: #4A5160; }
  .code { font: 400 17.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang HK', monospace; }
  .kw { fill: #8A3FFC; } .id { fill: #14161A; } .k { fill: #0F6E8B; }
  .s { fill: #0F8B7E; } .p { fill: #8A91A0; }
  .file { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang HK', monospace; fill: #8A91A0; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  .drift { animation: drift 18s ease-in-out infinite alternate; transform-origin: center; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes drift { to { transform: translate(40px, -20px) scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { .cursor, .drift { animation: none; } }
</style>
<g clip-path="url(#frame)">
  <rect width="1280" height="400" fill="#FAFAF7"/>
  <g filter="url(#blur)" opacity="0.9">
    <circle class="drift" cx="1080" cy="80" r="190" fill="#CDEFE5"/>
    <circle class="drift" cx="760" cy="380" r="170" fill="#FDE3D3" style="animation-delay:-6s"/>
    <circle class="drift" cx="1240" cy="360" r="150" fill="#E2E0FA" style="animation-delay:-12s"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="399" rx="23.5" fill="none" stroke="#E6E5DF"/>

  <text x="72" y="100" class="eyebrow fade d1">FULL-STACK · AI · UI/UX</text>
  <text x="66" y="180" class="name fade d2">Hi there.</text>
  <text x="72" y="230" class="tag fade d3">Building <tspan font-weight="600" fill="#14161A">AI tools for education</tspan>,</text>
  <text x="72" y="266" class="tag fade d3">and the interfaces around them.</text>
  <g class="fade d4"><rect x="72" y="296" width="116" height="40" rx="20" fill="#FFFFFF" stroke="#DCDAD3"/><text x="130" y="322" text-anchor="middle" class="chip">Full-stack</text></g><g class="fade d4"><rect x="200.0" y="296" width="107" height="40" rx="20" fill="#FFFFFF" stroke="#DCDAD3"/><text x="254" y="322" text-anchor="middle" class="chip">AI / LLMs</text></g><g class="fade d4"><rect x="319.4" y="296" width="90" height="40" rx="20" fill="#FFFFFF" stroke="#DCDAD3"/><text x="364" y="322" text-anchor="middle" class="chip">UI / UX</text></g>

  <g class="fade d3" filter="url(#shadow)">
    <rect x="690" y="52" width="530" height="296" rx="16" fill="#FFFFFF" stroke="#E6E5DF"/>
  </g>
  <g class="fade d3">
    <circle cx="716" cy="78" r="5.5" fill="#FF5F57"/>
    <circle cx="734" cy="78" r="5.5" fill="#FEBC2E"/>
    <circle cx="752" cy="78" r="5.5" fill="#28C840"/>
    <text x="955" y="82" text-anchor="middle" class="file">now.ts</text>
    <line x1="690" x2="1220" y1="100" y2="100" stroke="#E6E5DF"/>
  </g>
  <text x="718" y="144" class="code line" xml:space="preserve"><tspan class="kw">const </tspan><tspan class="id">now</tspan><tspan class="p"> = {</tspan></text><text x="718" y="174" class="code line" xml:space="preserve"><tspan class="k">  building</tspan><tspan class="p">: </tspan><tspan class="s">"AI tools for schools"</tspan><tspan class="p">,</tspan></text><text x="718" y="204" class="code line" xml:space="preserve"><tspan class="k">  web</tspan><tspan class="p">: [</tspan><tspan class="s">"Next.js"</tspan><tspan class="p">, </tspan><tspan class="s">"React"</tspan><tspan class="p">, </tspan><tspan class="s">"Tailwind"</tspan><tspan class="p">],</tspan></text><text x="718" y="234" class="code line" xml:space="preserve"><tspan class="k">  api</tspan><tspan class="p">: [</tspan><tspan class="s">"Django"</tspan><tspan class="p">, </tspan><tspan class="s">"Celery"</tspan><tspan class="p">, </tspan><tspan class="s">"Postgres"</tspan><tspan class="p">],</tspan></text><text x="718" y="264" class="code line" xml:space="preserve"><tspan class="k">  ai</tspan><tspan class="p">: [</tspan><tspan class="s">"LLMs"</tspan><tspan class="p">, </tspan><tspan class="s">"OCR"</tspan><tspan class="p">, </tspan><tspan class="s">"RAG"</tspan><tspan class="p">],</tspan></text><text x="718" y="294" class="code line" xml:space="preserve"><tspan class="k">  design</tspan><tspan class="p">: </tspan><tspan class="s">"tokens first"</tspan><tspan class="p">,</tspan></text><text x="718" y="324" class="code line" xml:space="preserve"><tspan class="p">};</tspan></text>
  <rect class="cursor" x="744" y="308" width="10" height="20" rx="1.5" fill="#0F8B7E"/>
</g>
</svg>
